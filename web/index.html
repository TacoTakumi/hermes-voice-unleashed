* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ink);
  color: var(--paper);
  font: 17px/1.5 var(--type);
  display: grid;
  /* minmax(0, ...): a long unwrapped line must not widen the page past the screen */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto 1fr auto;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header { padding: 28px var(--gutter) 8px; min-width: 0; }
#state {
  margin: 0;
  font-family: "EB Garamond", Georgia, serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(44px, 13vw, 88px);
  line-height: 1;
  letter-spacing: 0;
  color: var(--paper);
  transition: color 160ms ease;
}
/* The first page shows the logo and what this is; a session shows its state instead.
   The second logo line is sized to the width of the first: the ratio of the two text
   widths in this font. */
#brand, #intro { display: none; }
body:has(#chooser:not([hidden])) #brand, body:has(#chooser:not([hidden])) #intro { display: block; }
body:has(#chooser:not([hidden])) #state,
body:has(#chooser:not([hidden])) #transcript,
body:has(#chooser:not([hidden])) #detail:empty { display: none; }
#brand { margin: 0; font: italic 400 clamp(64px, 20vw, 96px)/0.95 "EB Garamond", Georgia, serif; color: var(--paper); }
#brand span { display: block; width: max-content; }
#brand span + span { font-size: 0.4797em; margin-top: 0.12em; }
#intro { margin: 16px 0 0; color: var(--muted); font-size: 16px; max-width: 30rem; }
body[data-who="you"] #state { color: var(--you); }
body[data-who="hermes"] #state { color: var(--hermes); }
body[data-who="alert"] #state { color: var(--alert); }
/* The time of a running turn sits beside the state word, so it comes and goes without
   moving what is under it. */
#headline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
#elapsed { margin: 0; color: var(--hermes); font-size: 18px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
#elapsed[hidden] { display: none; }
#detail { margin: 10px 0 0; color: var(--muted); font-size: 16px; min-height: 1.5em; }
/* A low strip: the room goes to the log. */
#meter { display: block; width: 100%; height: 32px; margin-top: 10px; }
#meter[hidden] { display: none; }
#transcript {
  margin: 14px 0 0;
  font-size: 22px;
  line-height: 1.35;
  color: var(--you);
}
/* No words heard: the line takes no room. It stays in the layout, so the words are
   announced when they come. */
#transcript:empty { margin: 0; }
#reasoning { margin-top: 12px; }
#reasoning[hidden] { display: none; }
#reason-fold { display: block; width: 100%; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
#reason-full { margin: 4px 0 0; max-height: min(12em, 18dvh); overflow-y: auto; color: var(--muted); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
#activity { margin-top: 12px; }
#activity[hidden] { display: none; }
button.fold {
  font: 500 14px/1 var(--type);
  color: var(--muted);
  background: none;
  border: 0;
  padding: 6px 0;
  min-width: 0;
  min-height: 0;
}
#tools {
  list-style: none;
  margin: 4px 0 0;
  padding: 0;
  max-height: min(6 * 1.6em, 20dvh);
  overflow-y: auto;
  font-size: 15px;
  line-height: 1.6;
}
.tool { display: flex; gap: 8px; white-space: nowrap; }
.tool[hidden] { display: none; } /* the display above would override the hidden attribute */
.tool .name { color: var(--paper); font-weight: 700; }
.tool .summary { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.tool .status { color: var(--muted); font-variant-numeric: tabular-nums; }
.tool.running .status { color: var(--hermes); }
.tool.failed .status { color: var(--alert); }
.group button.fold { padding: 2px 0; font-size: 15px; }
main { overflow-y: auto; padding: 8px var(--gutter) 16px; }
#log { list-style: none; margin: 0 auto; padding: 0; max-width: 40rem; display: flex; flex-direction: column; gap: 14px; }
#log[hidden] { display: none; }
/* The chooser: the New button, then one row per session. */
#chooser { margin: 0 auto; max-width: 40rem; display: flex; flex-direction: column; gap: 10px; }
#chooser[hidden] { display: none; }
#new { width: 100%; min-width: 0; margin-bottom: 8px; }
/* The newest session leads as a card to go on with; the rest are thin lines under Earlier. */
.sessions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
#earlier { margin: 14px 0 0; font: 500 12px/1 var(--type); text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255, 230, 203, 0.55); }
#earlier[hidden] { display: none; }
button.row .tag { border: 1px solid rgba(255, 230, 203, 0.15); border-radius: 2.5px; padding: 0 6px; font-size: 12px; line-height: 18px; color: var(--muted); white-space: nowrap; }
button.row.card { padding: 16px; box-shadow: inset 0 0 0 1px rgba(255, 230, 203, 0.15); gap: 4px 10px; align-items: center; }
button.row.card .label { flex: 1 0 100%; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--you); }
button.row.card .name { font: italic 400 30px/1.15 "EB Garamond", Georgia, serif; }
button.row.card .meta { font-size: 14px; }
button.row.line { flex-wrap: wrap; align-items: baseline; gap: 2px 10px; background: none; padding: 11px 0; border-radius: 0; border-bottom: 1px solid rgba(255, 230, 203, 0.15); }
/* The title takes the line; on a narrow screen the source, mark and age go under it. */
button.row.line .name { flex: 1 1 14rem; min-width: 0; }
button.row.line .info { display: flex; align-items: baseline; gap: 10px; margin-left: auto; min-width: 0; max-width: 100%; }
button.row.line .tag { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
button.row.line .voice { margin-left: 0; font-size: 12px; white-space: nowrap; }
button.row.line .when { color: rgba(255, 230, 203, 0.55); font-size: 13px; white-space: nowrap; }
button.row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 10px;
  width: 100%;
  min-width: 0;
  text-align: left;
  font: 400 16px/1.35 var(--type);
  color: var(--paper);
  background: var(--ink-raised);
  padding: 12px 16px;
}
button.row .name { flex: 1 0 100%; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.row .meta { color: var(--muted); font-size: 14px; }
button.row .voice { color: var(--glow); font-size: 14px; font-weight: 500; margin-left: auto; }
footer[hidden] { display: none; }
.turn { max-width: 34rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.turn.user { align-self: flex-end; text-align: right; color: var(--you); }
.turn.hermes { align-self: flex-start; padding-left: 14px; border-left: 3px solid var(--hermes); }
.turn.note { align-self: center; color: var(--muted); font-size: 15px; }
footer { padding: 12px var(--gutter) 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
/* Shown only while the browser keeps reply playback locked after a join without a tap. */
#unmute { background: var(--glow); }
#unmute[hidden] { display: none; }
/* The switch for the sound cues: a quiet button, on or off, beside the main one. */
#cues { min-width: 0; padding: 12px 18px; background: var(--ink-raised); color: var(--paper); box-shadow: inset 0 0 0 1px rgba(255, 230, 203, 0.3); }
#cues[aria-pressed="false"] { color: color-mix(in srgb, var(--paper) 60%, transparent); }
/* The approval prompt: above the footer buttons, where a thumb reaches it. The command
   scrolls inside itself, so a long script never pushes the choices off the screen. */
#approval { flex: 1 0 100%; min-width: 0; background: var(--ink-raised); box-shadow: inset 0 0 0 1px var(--glow); border-radius: 2.5px; padding: 12px 14px; }
#approval[hidden] { display: none; }
#approval-reason { margin: 0 0 6px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--glow); }
#approval-command { margin: 0; max-height: min(9em, 22dvh); overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--paper); }
#approval-choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#approval-choices button { flex: 1 1 8rem; min-width: 0; padding: 12px 14px; background: var(--ink-raised); color: var(--paper); box-shadow: inset 0 0 0 1px rgba(255, 230, 203, 0.3); }
#approval-choices button[data-style="primary"] { background: var(--paper); color: var(--ink); box-shadow: none; }
#approval-choices button[data-style="danger"] { background: var(--alert); color: #fff; box-shadow: none; }
/* The Hermes desktop button: soft fills, a 2.5px corner, medium weight. Sized for a thumb. */
button {
  font: 500 15px/1.2 var(--type);
  color: var(--ink);
  background: var(--paper);
  border: 0;
  border-radius: 2.5px;
  padding: 12px 28px;
  min-width: 14rem;
  min-height: 44px;
  cursor: pointer;
  transition: background-color 100ms, box-shadow 100ms, color 100ms;
}
button[aria-pressed="true"] { background: var(--ink-raised); color: var(--paper); box-shadow: inset 0 0 0 1px rgba(255, 230, 203, 0.3); }
button:focus-visible { outline: 3px solid rgba(255, 230, 203, 0.5); outline-offset: 2px; }
@media (hover: hover) {
  button:not(.fold):not(.row):not([aria-pressed="true"]):hover { filter: brightness(0.92); }
  button.row:hover { background: color-mix(in srgb, #ffe6cb 10%, #041c1c); }
  button.fold:hover { color: var(--paper); }
}
/* The header never grows past its cap (set per layout below). The reasoning text and the
   tool list give up their height first and scroll inside themselves, so the newest tool
   line stays in view. Only when the rest of the header alone does not fit (a phone held
   sideways, a short wide window) does the header scroll, and then only by the user's hand. */
header { display: flex; flex-direction: column; overflow-y: auto; }
header > * { flex-shrink: 0; }
/* A section shrinks down to its control plus one line of its list, never below: a header
   too short for that scrolls instead of drawing the parts over each other. */
#reasoning:not([hidden]), #activity:not([hidden]) { display: flex; flex-direction: column; min-height: 0; flex-shrink: 1; }
#reasoning:not([hidden]) { min-height: 28px; }
#reasoning:has(> #reason-full:not([hidden])) { min-height: 58px; }
#activity:has(> #tools:not([hidden])) { min-height: 56px; }
#reasoning > button, #activity > button { flex-shrink: 0; }
#activity > button { align-self: flex-start; }
#reason-full, #tools { min-height: 1.6em; flex-shrink: 1; }
/* On a phone the header shares the screen with the log: it stops at 62% of the screen. */
@media (max-width: 899px) { header { max-height: 62dvh; } }
@media (min-width: 900px) {
  body { grid-template-columns: minmax(20rem, 28rem) minmax(0, 1fr); grid-template-rows: 1fr auto; }
  /* The header has its own column: it stops at the window height, less the safe area the
     body keeps clear, so it never makes the page taller than the window. */
  header { grid-row: 1 / span 2; padding: 48px 32px; max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  main { grid-column: 2; padding-top: 48px; }
  footer { grid-column: 2; }
  /* Beside the large state word only a short time fits: here the time keeps its own line. */
  #elapsed { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { #state { transition: none; } }
</style>
</head>
<body data-who="none">
<header>
  <h1 id="brand"><span>Hermes</span> <span>Voice Unleashed</span></h1>
  <p id="intro">Talk with your Hermes agent, hands free. It hears you, answers out loud and shows what it is doing while it works.</p>
  <div id="headline">
    <h1 id="state">Tap to start</h1>
    <p id="elapsed" hidden></p>
  </div>
  <p id="detail">Hermes listens while this page is open.</p>
  <canvas id="meter" aria-hidden="true"></canvas>
  <p id="transcript" aria-live="polite"></p>
  <section id="reasoning" hidden aria-label="What Hermes is thinking">
    <button id="reason-fold" class="fold" type="button" aria-expanded="false" aria-controls="reason-full"><span id="reason-line"></span></button>
    <p id="reason-full" hidden></p>
  </section>
  <section id="activity" hidden aria-label="What Hermes is doing">
    <button id="fold" class="fold" type="button" aria-expanded="true" aria-controls="tools">Hide tools</button>
    <ol id="tools"></ol>
  </section>
</header>
<main>
  <section id="chooser" hidden aria-label="Sessions">
    <ol id="latest" class="sessions" aria-label="Continue"></ol>
    <button id="new" type="button">New session</button>
    <h2 id="earlier" hidden>Earlier</h2>
    <ol id="sessions" class="sessions" aria-labelledby="earlier"></ol>
  </section>
  <ol id="log" aria-live="polite"></ol>
</main>
<footer>
  <section id="approval" hidden aria-label="Approval needed" aria-live="assertive">
    <p id="approval-reason"></p>
    <pre id="approval-command"></pre>
    <div id="approval-choices"></div>
  </section>
  <button id="toggle" type="button" aria-pressed="false">Start talking</button>
  <button id="unmute" type="button" hidden>Tap for sound</button>
  <button id="cues" type="button" aria-pressed="true">Sound cues: on</button>
</footer>
<script>
"use strict";
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";
  const browserAec = params.get("aec") !== "0";
  // The Hermes session the next connect asks for: an id, "new", or null for the one the
  // lane is on. The session is the page's identity: the URL carries session=<id> while
  // the page is on one, so a reload rejoins it, and the chooser sits at the bare URL
  // (the token only), so Back from a session returns to it.
  let sessionChoice = params.get("session") || null;
  const MIC_RATE = 16000;
  // The server's close codes: another page took the voice; the session the page asked
  // for could not be joined.
  const REPLACED_CLOSE = 4001, JOIN_FAILED_CLOSE = 4002;

  const $ = (id) => document.getElementById(id);
  const stateEl = $("state"), detailEl = $("detail"), transcriptEl = $("transcript");
  const logEl = $("log"), toggle = $("toggle"), unmuteEl = $("unmute"), meter = $("meter"), cuesEl = $("cues");
  const chooserEl = $("chooser"), sessionsEl = $("sessions"), newEl = $("new");
  const latestEl = $("latest"), earlierEl = $("earlier");
  const headerEl = document.querySelector("header"), footerEl = document.querySelector("footer");
  const mainEl = document.querySelector("main");
  const reasoningEl = $("reasoning"), reasonFoldEl = $("reason-fold"), reasonLineEl = $("reason-line");
  const reasonFullEl = $("reason-full");
  const activityEl = $("activity"), toolsEl = $("tools"), foldEl = $("fold"), elapsedEl = $("elapsed");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let ws = null, micCtx = null, micStream = null, micNode = null, playCtx = null;
  let running = false, muted = false, retry = 0, wakeLock = null;
  // The last error frame's message: the server closes the socket right after it, so
  // the Reconnecting screen repeats it where it can be read.
  let lastError = null;
  let ending = false; // the session ended: the notice plays out, then the chooser
  let endDrain = 0; // the timer of the wait for that notice, so a stop can cancel it
  let audioUntil = 0; // when the last queued reply audio has left the speaker, in performance.now() ms
  // Mic samples sent on this connection, and when the last frame of them was captured.
  let micSent = 0, micAnchor = null;
  let captureLatency = 0; // ms from the mic to a frame reaching the page, read once per mic start
  let moved = false; // the voice moved to another page: the button leads back to the sessions
  let level = 0, speakingLevel = 0;
  let hermesTurn = null; // the <li> the current reply's text goes into
  let absorbing = null;  // a final answer shown in place while its late deltas still arrive
  let busy = false; // a Hermes turn runs: from its utterance until turn_done
  let turnStreamed = false; // this turn streamed reply text
  let approval = null; // the request id of the approval prompt that is open, in an object
  // How long reply audio must be silent before the page stops showing Speaking: chunks
  // arrive paced, so the queue can run dry for a moment between two of them.
  const QUIET_MS = 600;
  // How long the page shows Hearing you after the last words it was sent: words that
  // lead to nothing may get no frame that says so.
  const HEARD_MS = 4000;
  let heardTimer = null;

  // --- the thinking sound ---------------------------------------------------------
  // While a turn runs and no reply audio plays the page would be silent, and a user who
  // does not look at it cannot tell work from a dead turn. A quiet blip repeats for that
  // time. It is the thinking sound of Hermes Desktop and of the Hermes CLI voice mode
  // (apps/desktop/src/lib/thinking-sound.ts in hermes-agent, MIT License, Copyright (c)
  // 2025 Nous Research), one octave higher and louder: a phone loudspeaker gives little
  // under 400 Hz, where their tones are, and more level alone did not help. It plays on the reply's context, so the
  // browser's echo canceller knows it, and the server is told nothing: it is no reply.
  const CUE_STATES = ["Thinking", "Working"];
  const CUE_PITCHES = [784, 659.3]; // G5 and E5, in turn
  const CUE_GAIN = 0.2; // the peak of a blip; Hermes Desktop has 0.08
  let cueTimer = null, cueCount = 0, cueVoice = null;
  // The user's switch for the cues. On unless the URL says cues=0 or the browser holds an
  // earlier "off"; a tap on the button changes it at once and the browser keeps it.
  const CUES_KEY = "voice-unleashed.cues";
  function cuesStored() {
    try { return localStorage.getItem(CUES_KEY); } catch (e) { return null; }  // storage can be blocked
  }
  let cuesOn = params.get("cues") !== "0" && cuesStored() !== "0";
  function cuesShow() {
    cuesEl.textContent = cuesOn ? "Sound cues: on" : "Sound cues: off";
    cuesEl.setAttribute("aria-pressed", String(cuesOn));
  }
  // One soft blip: a sine that glides down, with a smooth attack and decay (no click).
  function cueBlip(freq) {
    const t0 = playCtx.currentTime + 0.01, dur = 0.16;
    const osc = playCtx.createOscillator(), env = playCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.72, t0 + dur);
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(CUE_GAIN, t0 + 0.02);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(env).connect(playCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
    cueVoice = osc;
  }
  function cueWanted() {
    const silent = !(reply && (reply.playing > 0 || reply.audible));
    // A context that does not run (playback still locked) keeps its clock still: blips
    // scheduled on it would all sound at once when it is let go.
    const plays = !!playCtx && playCtx.state === "running";
    return cuesOn && running && !ending && plays && silent && CUE_STATES.includes(stateEl.textContent);
  }
  function cueTick() {
    cueTimer = null;
    if (!cueWanted()) return;  // the state moved on without a call to cueSync
    try { cueBlip(CUE_PITCHES[cueCount % CUE_PITCHES.length]); } catch (e) { /* no audio: the loop stays harmless */ }
    cueCount += 1;
    cueTimer = setTimeout(cueTick, 800 + Math.random() * 400); // not a metronome
  }
  // Start or stop the sound by what the page shows and plays now. Called wherever that
  // changes; a call that changes nothing does nothing.
  function cueSync() {
    const want = cueWanted();
    if (want && cueTimer === null) cueTimer = setTimeout(cueTick, 400);
    else if (!want && cueTimer !== null) {
      clearTimeout(cueTimer);
      cueTimer = null;
      // A blip that sounds now ends with the silence, not 160 ms into the reply.
      if (cueVoice) { try { cueVoice.stop(); } catch (e) { /* it has ended */ } }
      cueVoice = null;
    }
  }

  // --- what the page shows --------------------------------------------------------
  // While an approval prompt is open the turn waits for the user, whatever else is true:
  // the states that only say who has the floor give way to that. A state that reports
  // something new (the user's speech is heard, an error) still shows.
  const FLOOR_STATES = ["Listening", "Muted", "Thinking", "Working", "Speaking"];
  function show(state, who, detail) {
    if (approval && FLOOR_STATES.includes(state)) {
      state = "Waiting for approval";
      who = "hermes";
      detail = muted ? "Tap a choice." : "Say yes or no, or tap a choice.";
    }
    stateEl.textContent = state;
    showElapsed();
    document.body.dataset.who = who;
    if (detail !== undefined) detailEl.textContent = detail;
    cueSync();
  }
  function addTurn(kind, text) {
    const li = document.createElement("li");
    li.className = "turn " + kind;
    li.textContent = text;
    logEl.appendChild(li);
    logPinSoon();
    return li;
  }
  // The log follows its end: it moves when a line is added, when reply text streams into
  // a line and when the header takes or gives back room, unless the user scrolled it up
  // to read. It moves without animation: a smooth scroll started again for each piece of
  // text lags behind it.
  // Only the user's own scroll changes whether the log follows, and the scroll event of
  // the page's own move must not pass for one: it comes a frame late, when more text may
  // have made the log longer, so it can look like a scroll that stopped short of the end.
  // So the page keeps the position it last saw. A scroll right after a gesture that went
  // up from there, away from the end, holds the log. One that went down to the end, or to
  // within two lines of it (text may have come since), makes it follow again. An event
  // at the position last seen changes nothing. Nor does a move up when the log's area
  // changed height since the last look: the header gave room back and the browser moved
  // the position itself.
  let logAtEnd = true, logGestureUntil = 0, logPinQueued = false, logTop = 0, logHeight = 0;
  function logToEnd() {
    mainEl.scrollTop = mainEl.scrollHeight;
    logTop = mainEl.scrollTop;
    logHeight = mainEl.clientHeight;
    logAtEnd = true;
  }
  for (const kind of ["wheel", "touchstart", "pointerdown", "keydown"]) {
    mainEl.addEventListener(kind, () => { logGestureUntil = Date.now() + 1000; }, { passive: true });
  }
  mainEl.addEventListener("scroll", () => {
    const now = Date.now(), top = mainEl.scrollTop, before = logTop;
    const resized = mainEl.clientHeight !== logHeight;
    logTop = top;
    logHeight = mainEl.clientHeight;
    if (now > logGestureUntil || logEl.hidden) return;
    logGestureUntil = Math.max(logGestureUntil, now + 300);
    const left = mainEl.scrollHeight - mainEl.clientHeight - top;
    if (left <= 4 || (top > before && left <= 48)) logAtEnd = true;
    else if (top < before && !resized) logAtEnd = false;
  });
  function logPinSoon() {
    if (logPinQueued) return;
    logPinQueued = true;
    requestAnimationFrame(() => { logPinQueued = false; if (logAtEnd && !logEl.hidden) logToEnd(); });
  }
  const logSizes = new ResizeObserver(logPinSoon);
  logSizes.observe(mainEl);
  logSizes.observe(logEl);
  // Whether the server can hear a barge yet. Its turn engine first learns the user's
  // voice from a few seconds of speech, and fires no barge until then: "learning". The
  // page says so where it would invite the user to talk over a reply. "ready" shows for
  // a moment when the voice is learned; null is the normal case, with nothing to say.
  const BARGE_READY_MS = 3000;
  let bargeState = null, bargeTimer = null;
  function bargeSet(state) {
    clearTimeout(bargeTimer);
    bargeState = state;
    if (state === "ready") bargeTimer = setTimeout(() => bargeSet(null), BARGE_READY_MS);
    // Only a line that says who has the floor is written again: a state that reports
    // something (the user is heard, an error) keeps its own.
    if (FLOOR_STATES.includes(stateEl.textContent)) status();
  }
  function listening() {
    if (!running || ending) return;
    const invite = bargeState === "learning" ? "Learning your voice. Barge-in is off."
      : bargeState === "ready" ? "Barge-in ready." : "Say something.";
    show(muted ? "Muted" : "Listening", "none", muted ? "Your microphone is off." : invite);
  }
  // --- the approval prompt: the command, why it needs approval, one button per choice ----
  const approvalEl = document.getElementById("approval");
  const approvalChoices = document.getElementById("approval-choices");
  function approvalOpen(f) {
    approval = { id: f.request_id || null };
    document.getElementById("approval-reason").textContent =
      f.reason ? `Approval needed: ${f.reason}` : "Approval needed";
    document.getElementById("approval-command").textContent = f.command || "";
    approvalChoices.textContent = "";
    for (const c of f.choices || []) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = c.label || c.choice;
      button.dataset.choice = c.choice;
      button.dataset.style = c.style || "";
      button.addEventListener("click", () => {
        if (!approval) return;
        send({ type: "approval_answer", request_id: approval.id, choice: c.choice });
        approvalClose();
      });
      approvalChoices.appendChild(button);
    }
    approvalEl.hidden = false;
    status();
  }
  // The prompt is over: answered here or by voice, withdrawn or timed out.
  function approvalClose(restate = true) {
    if (!approval) return;
    approval = null;
    approvalEl.hidden = true;
    approvalChoices.textContent = "";
    if (restate) status();
  }
  // What Hermes does in the turn that runs: Working while one of its tool calls runs,
  // Thinking otherwise.
  function turnState() {
    const tool = toolRuns();
    const detail = tool ? "Hermes is still working." : "Hermes is working on it.";
    // Speech stops the turn, but while reply audio plays that is a barge.
    const deaf = bargeState === "learning" && reply && reply.audible;
    const stops = deaf ? " Barge-in is off: still learning your voice." : " Speaking now stops it.";
    show(tool ? "Working" : "Thinking", "hermes", muted ? detail : detail + stops);
  }
  function toolRuns() {
    return turnTools.some((li) => li.classList.contains("running"));
  }
  // What the page shows when nobody is talking: Hermes at work on a tool call, Hermes
  // speaking, Hermes thinking, or waiting for the user. A tool call that runs shows as
  // Working also while the reply plays: Hermes says a sentence before most tool calls,
  // and the audio itself tells the user that it speaks.
  function status() {
    if (!running || ending) return;
    if (busy && toolRuns()) turnState();
    else if (reply && reply.audible) {
      show("Speaking", "hermes", bargeState === "learning" ? "Barge-in is off: still learning your voice."
        : bargeState === "ready" ? "Barge-in ready. Talk over it to stop it." : "Talk over it to stop it.");
    }

    else listening();
  }
  // A tool call began or ended: the state line follows when it shows what Hermes does.
  // Any other state (the user has the floor, a prompt, an alert) stays.
  function toolChanged() {
    if (busy && ["Thinking", "Working", "Speaking"].includes(stateEl.textContent)) status();
  }

  // --- the reasoning line: the newest sentence, the whole text on a tap ------------------
  let reasonText = "", reasonFirstAt = null, reasonLastAt = null;
  function newestSentence(text) {
    const parts = text.split(/(?<=[.!?])\s+|\n+/).map((t) => t.trim()).filter(Boolean);
    return parts.length ? parts[parts.length - 1] : "";
  }
  function reasoningClear() {
    reasonText = "";
    reasonFirstAt = reasonLastAt = null;
    reasonLineEl.textContent = reasonFullEl.textContent = "";
    reasonFullEl.hidden = true;
    reasonFoldEl.setAttribute("aria-expanded", "false");
    reasoningEl.hidden = true;
  }
  function reasoningDelta(text) {
    if (!text) return;
    reasonLastAt = Date.now();
    if (reasonFirstAt === null) reasonFirstAt = reasonLastAt;
    reasonText += text;
    reasonFullEl.textContent = reasonText.trim();
    reasonLineEl.textContent = newestSentence(reasonText);

    toolsPinSoon();
    if (!reasonFullEl.hidden) reasonFullEl.scrollTop = reasonFullEl.scrollHeight;
  }
  function reasoningDone() {
    if (reasonFirstAt !== null) reasonLineEl.textContent = "Reasoned for " + clock(reasonLastAt - reasonFirstAt);
  }

    const open = reasonFullEl.hidden;

    toolsPinSoon();
  });

  // --- the activity panel: one line per tool call ---------------------------------------
  const toolLines = new Map(); // call id -> its <li>
  // The tool list follows its newest line unless the user scrolled it up to read. Only a
  // scroll right after the user's own gesture counts: the browser also moves scrollTop
  // when the list grows or shrinks, and the page moves it when a line is added. A fling
  // keeps scrolling well after the finger left, so each scroll inside the window keeps
  // the window open a little longer and the scroll counts until it stops. (scrollend
  // would say when it stops, but not every Safari has it.)
  let toolsAtEnd = true, toolsGestureUntil = 0;
  function toolsToEnd() {
    toolsEl.scrollTop = toolsEl.scrollHeight;
    toolsAtEnd = true;
  }
  for (const kind of ["wheel", "touchstart", "pointerdown", "keydown"]) {
    toolsEl.addEventListener(kind, () => { toolsGestureUntil = Date.now() + 1000; }, { passive: true });
  }
  toolsEl.addEventListener("scroll", () => {
    const now = Date.now();
    if (now > toolsGestureUntil) return;
    toolsGestureUntil = Math.max(toolsGestureUntil, now + 300);
    toolsAtEnd = toolsEl.scrollTop + toolsEl.clientHeight >= toolsEl.scrollHeight - 4;
  });
  // Back to the end on the next frame, after the layout settled. Lines and reasoning can
  // arrive in one frame and leave the list as high as before, so a ResizeObserver alone
  // misses a list that grew and shrank again.
  let toolsPinQueued = false;
  function toolsPinSoon() {
    if (toolsPinQueued) return;
    toolsPinQueued = true;
    requestAnimationFrame(() => { toolsPinQueued = false; if (toolsAtEnd) toolsToEnd(); });
  }
  new ResizeObserver(toolsPinSoon).observe(toolsEl);
  // The header follows the same rule. Where its rest does not fit its cap (a phone held
  // sideways) the header scrolls itself, and the list's own pin cannot bring the newest
  // tool line into the header's box: the header has to move too. It moves only while
  // the user left it at its end; a header scrolled up to read stays there, whatever
  // the page adds below, until the user scrolls it back to its end. A gesture on the
  // tool list bubbles up here as well, which is right: each element reads its own
  // scroll. Where the header does not scroll (portrait) there is nothing to move.
  let headerAtEnd = true, headerGestureUntil = 0;
  function headerToEnd() {
    if (headerEl.scrollHeight > headerEl.clientHeight) headerEl.scrollTop = headerEl.scrollHeight;
  }
  for (const kind of ["wheel", "touchstart", "pointerdown", "keydown"]) {
    headerEl.addEventListener(kind, () => { headerGestureUntil = Date.now() + 1000; }, { passive: true });
  }
  headerEl.addEventListener("scroll", () => {
    const now = Date.now();
    if (now > headerGestureUntil) return;
    headerGestureUntil = Math.max(headerGestureUntil, now + 300);
    headerAtEnd = headerEl.scrollTop + headerEl.clientHeight >= headerEl.scrollHeight - 4;
  });
  // The header moves for one reason: to keep the newest tool line in view. With no tool
  // line on show (before the first tool call, after the session's tools were cleared, or
  // with the list folded away behind "Show tools") there is nothing to keep in view, and
  // a header that scrolled to its end anyway would push the state heading out of its box.
  // So the header stays put until a tool line is there to follow.
  function headerHasToolToShow() {
    return !activityEl.hidden && !toolsEl.hidden && toolsEl.querySelector(".tool") !== null;
  }
  let headerPinQueued = false;
  function headerPinSoon() {
    if (headerPinQueued) return;
    headerPinQueued = true;
    requestAnimationFrame(() => {
      headerPinQueued = false;
      if (headerAtEnd && headerHasToolToShow()) headerToEnd();
    });
  }
  // Anything that changes the height of the header or of what it holds (a state line, a
  // transcript that wraps, the reasoning text, the tool list, a rotation) can leave the
  // newest tool line below the header's edge.
  const headerSizes = new ResizeObserver(headerPinSoon);
  headerSizes.observe(headerEl);
  for (const child of headerEl.children) headerSizes.observe(child);
  window.addEventListener("resize", headerPinSoon);
  let turnStartedAt = null, turnTools = []; // the running turn: when it began, its tool lines
  function clock(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  // While Hermes works on a turn: the time since its utterance and its tool calls so far.
  function showElapsed() {
    const working = busy && turnStartedAt !== null && ["Thinking", "Working"].includes(stateEl.textContent);
    elapsedEl.hidden = !working;
    if (!working) return;
    const n = turnTools.length;
    elapsedEl.textContent = clock(Date.now() - turnStartedAt) + (n ? `, ${n} ${n === 1 ? "tool" : "tools"}` : "");
  }
  setInterval(showElapsed, 500);
  function turnBegin() {
    turnStartedAt = Date.now();
    turnTools = [];
  }
  // A line that still runs when its turn ends reads stopped. Its call stays known: a tool
  // that waits for a spoken approval ends its turn while it waits, then runs and sends
  // its tool_end under the same call id, and that tool_end must still find the line.
  function toolsStop() {
    for (const li of turnTools) {
      if (!li.classList.contains("running")) continue;
      li.className = "tool failed";
      li.querySelector(".status").textContent = "stopped";
    }
  }
  // The turn is over: its tool lines fold into one line that opens them again.
  function turnFold() {
    toolsStop();
    const lines = turnTools;
    if (lines.length) {
      const li = document.createElement("li");
      li.className = "group";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "fold";
      button.setAttribute("aria-expanded", "false");
      button.textContent = `${lines.length} ${lines.length === 1 ? "tool" : "tools"}, ${clock(Date.now() - (turnStartedAt || Date.now()))}`;
      button.addEventListener("click", () => {
        const open = button.getAttribute("aria-expanded") !== "true";
        button.setAttribute("aria-expanded", String(open));
        for (const line of lines) line.hidden = !open;
        if (open) {
          // Show the opened lines from their summary line; stop following the end until
          // the next tool line.
          toolsAtEnd = false;
          toolsEl.scrollTop += li.getBoundingClientRect().top - toolsEl.getBoundingClientRect().top;
        }
      });
      li.appendChild(button);
      toolsEl.insertBefore(li, lines[0]);
      for (const line of lines) line.hidden = true;
    }
    turnStartedAt = null;
    turnTools = [];
  }
  function seconds(ms) {
    const s = ms / 1000;
    if (s < 60) return s.toFixed(1) + " s";
    return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  }
  function part(cls, text) {
    const span = document.createElement("span");
    span.className = cls;
    span.textContent = text;
    return span;
  }
  function toolStart(f) {
    const li = document.createElement("li");
    li.className = "tool running";
    li.append(part("name", f.name || "tool"), part("summary", f.summary || ""), part("status", "running"));
    toolsEl.appendChild(li);
    if (f.id) toolLines.set(f.id, li);
    if (turnStartedAt === null) turnStartedAt = Date.now();
    turnTools.push(li);
    showElapsed();
    activityEl.hidden = false;
    toolsToEnd();
    toolsPinSoon();
    headerPinSoon();
  }
  const FAILED_WORDS = { error: "failed", timeout: "timed out", blocked: "blocked", cancelled: "cancelled" };
  // The line takes the result whatever it read before, running or stopped; the call is
  // then forgotten.
  function toolEnd(f) {
    const li = toolLines.get(f.id);
    if (!li) return;
    toolLines.delete(f.id);
    const failed = f.status && f.status !== "ok" ? (FAILED_WORDS[f.status] || "failed") : "";
    li.className = "tool " + (failed ? "failed" : "done");
    li.querySelector(".status").textContent = (failed ? failed + " " : "") + seconds(f.duration_ms || 0);
  }
  // The connection to this turn is gone: no tool_end, turn_done or reasoning will come
  // for it. Close the turn on the page, which marks what still ran as stopped.
  function turnAbort() {
    turnFold();
    reasoningDone();
  }
  foldEl.addEventListener("click", () => {
    const open = toolsEl.hidden;
    toolsEl.hidden = !open;
    foldEl.setAttribute("aria-expanded", String(open));
    foldEl.textContent = open ? "Hide tools" : "Show tools";
    if (open) toolsToEnd();
  });

  // --- reply audio ------------------------------------------------------------------
  // One reply plays at a time. Its edges go back to the server as playback frames: the
  // turn engine needs to know where on the mic stream the reply was heard.
  let reply = null;
  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  // --- the mic timeline ------------------------------------------------------------
  // A playback edge is placed on the mic stream: the number of mic samples this page had
  // sent when the sound left the speaker. Each sent mic frame anchors the count at its
  // capture time; the speaker time of a play context time comes from the output clock.
  function micFrameSent(bytes) {
    micSent += bytes / 2;
    micAnchor = { count: micSent, time: performance.now() - captureLatency };
  }
  // When the sound scheduled at play context time t reaches the speaker, in performance.now() ms.
  function speakerPerf(t) {
    if (playCtx.getOutputTimestamp) {
      const ts = playCtx.getOutputTimestamp();
      if (ts && ts.performanceTime > 0 && ts.contextTime > 0) return ts.performanceTime + (t - ts.contextTime) * 1000;
    }
    const out = playCtx.outputLatency ?? playCtx.baseLatency ?? 0;
    return performance.now() + (t - playCtx.currentTime + out) * 1000;
  }
  function micSampleAt(edgePerf) {
    // Muted, no mic audio exists past the sent count: an edge now sits at its end.
    if (muted || !micAnchor) return micSent;
    return Math.max(0, Math.round(micAnchor.count + (edgePerf - micAnchor.time) / 1000 * MIC_RATE));
  }

  // How far ahead audio is queued when it arrives after the reply's queue ran dry, in s.
  const REPLY_RESERVE = 0.2;
  function replyBegin(id, rate) {
    replyClear(null);
    reply = { id, rate, next: playCtx.currentTime + 0.06, first: null, samples: 0, sources: [], chunks: [],
              ended: false, started: false, startSample: 0, stopped: false, playing: 0, audible: false, quiet: null };
  }
  function replyPcm(buf) {
    if (!reply || reply.stopped) return;
    const pcm = new Int16Array(buf);
    if (!pcm.length) return;
    const audio = playCtx.createBuffer(1, pcm.length, reply.rate);
    const ch = audio.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const src = playCtx.createBufferSource();
    src.buffer = audio;
    src.connect(playCtx.destination);
    // The queue ran dry in a reply that has played: its audio comes no faster than it
    // plays just now (a new clause begins on the server). Played 20 ms after it arrives,
    // each chunk that is a little late would leave its own gap, a stutter. This chunk
    // waits for a reserve, so the ones that follow join it: one short pause.
    const dry = reply.first !== null && reply.next <= playCtx.currentTime;
    const at = Math.max(reply.next, playCtx.currentTime + (dry ? REPLY_RESERVE : 0.02));
    src.start(at);
    if (reply.first === null) {
      reply.first = at;
      const r = reply;
      setTimeout(() => {
        if (reply !== r || r.stopped) return;
        r.started = true;
        r.startSample = micSampleAt(speakerPerf(r.first));
        send({ type: "playback", event: "start", request_id: r.id, mic_sample: r.startSample });
        heard(r);
      }, Math.max(0, (at - playCtx.currentTime) * 1000));
    } else if (reply.started) {
      heard(reply);
    }
    reply.next = at + audio.duration;
    audioUntil = speakerPerf(reply.next);
    reply.samples += pcm.length;
    reply.sources.push(src);
    reply.chunks.push({ start: at, length: pcm.length });
    reply.playing += 1;
    cueSync();  // reply audio is queued: the thinking sound gives way before it is heard
    const r = reply;
    // The reply finishes when its audio_end has come and no chunk is still playing,
    // in whichever order those two happen.
    src.onended = () => {
      r.playing -= 1;
      if (r.playing > 0) return;
      if (r.ended) replyFinish(r, r.samples, r.next);
      else r.quiet = setTimeout(() => { if (r.playing === 0) { r.audible = false; if (reply === r) status(); } }, QUIET_MS);
    };

  }
  // Reply audio is playing again (or for the first time).
  function heard(r) {
    clearTimeout(r.quiet);
    r.quiet = null;
    if (r.audible || r.stopped) return;
    r.audible = true;
    if (reply === r) status();
  }
  function replyEnd(id) {
    if (!reply || reply.id !== id) return;
    reply.ended = true;
    if (reply.playing === 0) replyFinish(reply, reply.samples, reply.next);
  }
  // `edge` is the play context time the last played sample ended: the end of the last
  // chunk when the reply played out (or was cleared after that), now when it was cut
  // while still playing.
  function replyFinish(r, played, edge) {
    if (r.stopped) return;
    r.stopped = true;
    r.audible = false;
    clearTimeout(r.quiet);
    if (r.started) {
      const at = edge === undefined || edge > playCtx.currentTime ? playCtx.currentTime : edge;
      const mic = Math.max(r.startSample, micSampleAt(speakerPerf(at)));
      send({ type: "playback", event: "stop", request_id: r.id, reply_sample: played, mic_sample: mic });
    }

  function replyClear(id) {
    if (!reply || (id && reply.id !== id)) return;
    const r = reply;
    // Count the played part of each chunk from its own start time: a gap between chunks
    // (the page waiting for the next one) is silence and must not count as played.
    const now = playCtx.currentTime;
    let played = 0;
    for (const c of r.chunks) played += Math.min(c.length, Math.max(0, Math.round((now - c.start) * r.rate)));
    for (const s of r.sources) { try { s.onended = null; s.stop(); } catch (e) { /* already stopped */ } }
    audioUntil = performance.now();  // nothing of it is queued any more
    // The scheduled end of the last chunk: replyFinish clamps it to now while audio still plays.
    replyFinish(r, played, r.next);
  }

  // --- server frames ------------------------------------------------------------------
  function onFrame(f) {
    switch (f.type) {
      case "history":
        // Every connect gets one, before ready: the log starts over with the spoken lines
        // of the session the page is on, so a reconnect shows them once. It also names
        // the session, which after New the page learns only here: the URL follows it.
        if (f.session_id && running) setUrlSession(f.session_id);
        logEl.textContent = "";
        hermesTurn = null;
        logAtEnd = true; // a log that starts over shows its newest line
        for (const line of f.lines || []) addTurn(line.role === "user" ? "user" : "hermes", line.text || "");
        break;
      case "ready":
        retry = 0;
        lastError = null;
        busy = false;

        clearTimeout(bargeTimer);
        bargeState = null;

        break;
      case "error":
        lastError = f.message || "VoiceManager did not answer.";

        break;
      case "transcript":
        transcriptEl.textContent = f.text || "";
        clearTimeout(heardTimer);
        if (f.text && !(reply && reply.audible)) {
          show("Hearing you", "you");
          heardTimer = setTimeout(() => { if (stateEl.textContent === "Hearing you") status(); }, HEARD_MS);
        }
        // The words are gone and no utterance took them: the floor goes back.
        else if (!f.text && stateEl.textContent === "Hearing you") status();
        break;
      case "utterance":

        // reasoning, clock and tool lines stay.

        break;
      case "note":

        // not take the words as an answer.
        if (f.text) addTurn("note", f.text);
        break;
      case "barge_state":
        if (f.state === "learning" || f.state === "ready") bargeSet(f.state);
        break;
      case "approval_end":
        if (approval && (!f.request_id || f.request_id === approval.id)) approvalClose();
        break;

        break;
      case "tool_start":

        toolChanged();
        break;
      case "tool_end":

        toolChanged();
        break;

        busy = false;
        turnFold();
        reasoningDone();
        showElapsed();
        status();
        break;
      case "reply_delta":
        // A delta the final answer already shows (it arrived late) adds nothing. The
        // first delta after a tool call opens with a paragraph break the final has not,
        // and the last one can end in whitespace that Hermes strips from the final.
        if (absorbing) {
          const piece = absorbing.streamed ? f.text : f.text.trimStart();
          const next = absorbing.streamed + piece;
          if (absorbing.text.startsWith(next) || next.trimEnd() === absorbing.text.trimEnd()) {
            absorbing.streamed = next;
            break;
          }
        }
        absorbing = null;
        if (!hermesTurn) hermesTurn = addTurn("hermes", "");
        hermesTurn.textContent += f.text;
        logPinSoon();
        turnStreamed = true;
        break;
      case "reply": {
        // A message the gateway sent: tool progress, a note, an approval prompt, or the
        // final answer. The final answer was usually streamed already; anything else
        // gets its own line and the next streamed text starts a new one.
        // The final can also beat the last deltas, or every delta of a short answer:
        // when it extends the streamed text, show it in place. A line added here (nothing
        // streamed, or a final that is the last message only while the line still holds
        // the text from before a tool call) starts with none of it streamed. Either way
        // the late deltas the shown text already holds pass without a new line.
        const text = (f.text || "").trim();
        const streamed = hermesTurn ? hermesTurn.textContent.trim() : "";
        if (streamed && text.length > streamed.length && text.startsWith(streamed)) {
          const soFar = hermesTurn.textContent.trimStart();
          hermesTurn.textContent = f.text;
          logPinSoon();
          absorbing = { li: hermesTurn, text: f.text.trimStart(), streamed: soFar };
        } else if (text && !streamed.endsWith(text)) {
          const li = addTurn("hermes", f.text);
          absorbing = { li, text: f.text.trimStart(), streamed: "" };
        }
        hermesTurn = null;
        // A turn that ran streams its answer before this frame and ends with turn_done. A
        // message sent without a turn (a busy notice, a refusal) brings no turn_done, so
        // a reply with nothing streamed this turn is the whole answer: end the turn here.
        // Not when the server says the turn runs (a status line before the answer's
        // first text): that turn ends with its turn_done.
        if (busy && !turnStreamed && !f.turn_running) {
          busy = false;
          turnFold();
          reasoningDone();
          showElapsed();
          status();
        }
        break;
      }
      case "audio_start":
        replyBegin(f.request_id, f.sample_rate || 24000);
        break;
      case "audio_end":
        replyEnd(f.request_id);
        break;
      case "clear":
        replyClear(f.request_id || null);
        break;
      case "speech_failed":
        // The server got no audio for text it sent to be spoken. The text is on the
        // page; say why nothing was heard.
        addTurn("note", "This was not spoken: the voice server sent no audio.");
        break;
      case "replaced":
        handOver();
        break;
      case "session_end":
        // The user ended the session by voice. The server closes the connection next;
        // the page is done with it, once the notice still queued has played.
        endSession();
        break;
      case "session_new":
        // The user asked for a new session by voice. The server moved this connection
        // onto a fresh session itself; its history frame comes next and starts the log
        // over. The turn that was running belonged to the old session.
        busy = false;
        approvalClose(false);
        turnAbort();
        hermesTurn = null;
        transcriptEl.textContent = "";
        status();
        break;
      case "join_failed":
        // The session the page asked for could not be joined; the server closes next.
        leave(f.message || "The session could not be joined.");
        break;
    }
  }

  // --- connection ------------------------------------------------------------------
  function connect() {
    const scheme = location.protocol === "https:" ? "wss:" : "ws:";
    // One voice per profile: the page names no client lane, so a second page replaces the first.
    let url = `${scheme}//${location.host}/ws?token=${encodeURIComponent(token)}`;
    if (sessionChoice) url += `&session=${encodeURIComponent(sessionChoice)}`;
    show("Connecting", "none", "");
    ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";
    micSent = 0; // the plugin counts the mic samples of each connection from 0 too
    micAnchor = null;
    // The choice is asked for once, on the connect that reached the server. A reconnect
    // stays on the session the lane is on: asking for a new one again would open another.
    ws.onopen = () => { sessionChoice = null; };
    ws.onmessage = (ev) => {
      if (typeof ev.data === "string") {
        try { onFrame(JSON.parse(ev.data)); } catch (e) { /* not ours */ }
      } else {
        replyPcm(ev.data);
      }
    };
    ws.onclose = (ev) => {
      ws = null;
      busy = false;
      approvalClose(false); // a prompt cannot be answered over a closed socket
      turnAbort();
      replyClear(null);
      // The replaced and join_failed frames come before these closes and already did the
      // work; this covers a close without its frame.
      if (ev.code === REPLACED_CLOSE) { handOver(); return; }
      if (ev.code === JOIN_FAILED_CLOSE) { leave("The session could not be joined."); return; }
      if (!running) return;
      const wait = Math.min(10000, 500 * 2 ** retry++);
      const again = `Trying again in ${Math.round(wait / 1000) || 1} s.`;
      show("Reconnecting", "alert", lastError ? `${lastError} ${again}` : again);
      setTimeout(() => { if (running) connect(); }, wait);
    };
  }
  // Close the socket on purpose. Its handlers come off first: the close of a socket the
  // page gave up must not reconnect, and nothing the server still sends on it counts.
  function disconnect() {
    const sock = ws;
    ws = null;
    busy = false;
    approvalClose(false);
    turnAbort();
    replyClear(null);
    if (!sock) return;
    sock.onopen = sock.onmessage = sock.onclose = null;
    sock.close();
  }

  // --- microphone ------------------------------------------------------------------
  // The worklet turns the mic into 16 kHz mono 16-bit PCM in 20 ms frames. The capture
  // context runs at 16 kHz where the browser can resample the mic itself; otherwise the
  // worklet decimates from the context rate.
  const WORKLET = `
  class Mic16k extends AudioWorkletProcessor {
    constructor() {
      super();
      this.step = sampleRate / ${MIC_RATE};
      this.pos = 0; this.acc = 0; this.cnt = 0;
      this.out = new Int16Array(320); this.n = 0; this.sq = 0;
    }
    process(inputs) {
      const ch = inputs[0] && inputs[0][0];
      if (!ch) return true;
      for (let i = 0; i < ch.length; i++) {
        this.acc += ch[i]; this.cnt++; this.pos += 1;
        if (this.pos >= this.step) {
          this.pos -= this.step;
          const v = Math.max(-1, Math.min(1, this.acc / this.cnt));
          this.acc = 0; this.cnt = 0;
          this.sq += v * v;
          this.out[this.n++] = v < 0 ? v * 32768 : v * 32767;
          if (this.n === this.out.length) {
            this.port.postMessage({ pcm: this.out.buffer, rms: Math.sqrt(this.sq / this.n) }, [this.out.buffer]);
            this.out = new Int16Array(320); this.n = 0; this.sq = 0;
          }
        }
      }
      return true;
    }
  }
  registerProcessor("mic-16k", Mic16k);`;

  async function startMic() {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: browserAec, noiseSuppression: browserAec, autoGainControl: true },
    });
    let source;
    try {
      micCtx = new AudioContext({ sampleRate: MIC_RATE });
      source = micCtx.createMediaStreamSource(micStream);
    } catch (e) {
      if (micCtx) micCtx.close();
      micCtx = new AudioContext();
      source = micCtx.createMediaStreamSource(micStream);
    }
    // Not awaited: a context made outside a tap (a rejoin) can hang or reject here.
    micCtx.resume().catch(() => {});
    const url = URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }));
    await micCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    micNode = new AudioWorkletNode(micCtx, "mic-16k");
    // The capture latency does not change while the mic runs: read it once here, not
    // on every frame. The track's own figure first, else the context's, else none.
    const settings = micStream.getAudioTracks()[0]?.getSettings?.();
    captureLatency = 1000 * (typeof settings?.latency === "number" ? settings.latency
      : typeof micCtx.baseLatency === "number" ? micCtx.baseLatency : 0);
    micNode.port.onmessage = (ev) => {
      level = Math.max(level * 0.6, Math.min(1, ev.data.rms * 6));
      if (!muted && ws && ws.readyState === 1) {
        ws.send(ev.data.pcm);
        micFrameSent(ev.data.pcm.byteLength);
      }
    };
    source.connect(micNode);
    const sink = micCtx.createGain();
    sink.gain.value = 0;
    micNode.connect(sink).connect(micCtx.destination);
  }

  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (running && document.visibilityState === "visible") keepAwake();
  });

  async function start() {
    if (!token) { show("No token", "alert", "Open this page with ?token= set to the access token."); return; }
    if (!window.isSecureContext) {
      show("Needs HTTPS", "alert", "Browsers allow the microphone only over HTTPS or on localhost.");
      return;
    }
    toggle.disabled = true;
    try {
      playCtx = new AudioContext();
      const unlocked = unlockPlayback(playCtx);
      await startMic();
      unlocked();
    } catch (e) {
      show("No microphone", "alert", "Allow the microphone for this page, then try again.");
      micOff();  // a start that failed after the mic opened must not leave it on
      if (playCtx) playCtx.close().catch(() => {});
      playCtx = null;
      unmuteEl.hidden = true;
      toggle.disabled = false;
      return;
    }
    running = true;
    toggle.disabled = false;
    toggle.textContent = "Mute microphone";
    keepAwake();
    connect();
    draw();
  }

  // Reply playback must be let go by the browser. A context made on a tap runs at once.
  // One made on a load (a rejoin) may stay suspended: its resume() rejects, or resolves
  // or hangs with the state still "suspended". The page joins all the same, and shows
  // one button that resumes the context on a tap for as long as it is not running.
  // Returns the check to run once the mic is up, when the state has had time to settle.
  function unlockPlayback(ctx) {
    const check = () => { if (playCtx === ctx) { unmuteEl.hidden = ctx.state === "running"; cueSync(); } };
    ctx.onstatechange = check;
    ctx.resume().then(check, check);
    return check;
  }
  unmuteEl.addEventListener("click", () => {
    const ctx = playCtx;
    if (!ctx) { unmuteEl.hidden = true; return; }
    const check = () => { if (playCtx === ctx) { unmuteEl.hidden = ctx.state === "running"; cueSync(); } };
    ctx.resume().then(check, check);
  });

  // The mic and its context go. The worklet stops with the context: on a stopped track
  // alone it would go on sending frames of silence.
  // Silence the mic without releasing it: nothing more is captured, and the device
  // sees no change. Releasing a capture makes a phone switch its audio mode, which is
  // heard in whatever plays at that moment.
  function micSilence() {
    if (micStream) for (const track of micStream.getTracks()) track.enabled = false;
  }
  function micOff() {
    if (micStream) for (const track of micStream.getTracks()) track.stop();
    micStream = micNode = null;
    if (micCtx) micCtx.close().catch(() => {});
    micCtx = null;
  }
  // The reverse of start: the socket, the mic, its contexts and the wake lock go; the
  // button offers a start again. The drawing loop ends on its own once running is off.
  // A wait for the end notice ends here too: a stop during it (a history move to another
  // session) means the page is done with that end, and its wait must not leave the
  // session the page joins next.
  function stop() {
    running = false;
    cueSync();
    clearTimeout(bargeTimer);
    bargeState = null;
    ending = false;
    moved = false;
    clearTimeout(endDrain);
    endDrain = 0;
    disconnect();
    retry = 0;
    lastError = null;  // the reason belongs to the session that gave it
    muted = false;
    micOff();
    if (playCtx) { playCtx.onstatechange = null; playCtx.close().catch(() => {}); }
    playCtx = null;
    unmuteEl.hidden = true;
    if (wakeLock) Promise.resolve(wakeLock.release()).catch(() => {});
    wakeLock = null;
    level = speakingLevel = 0;
    transcriptEl.textContent = "";
    toggle.textContent = "Start talking";
    toggle.setAttribute("aria-pressed", "false");
  }
  // The page is done with its session: stop, then offer the sessions again, with
  // `detail` as the line under the heading when there is something to say. The URL
  // loses its session: a reload shows the chooser, and Back from a later join returns here.
  function leave(detail) {
    stop();
    reasoningClear();
    toolsEl.textContent = "";
    activityEl.hidden = true;
    setUrlSession(null);
    showChooser(detail);
  }
  // The session ended by voice. The mic is silenced at once and the socket no longer
  // counts: the server closes it next, and that close must not reconnect. The mic is
  // released when the page leaves, after the notice: a release while the notice plays
  // garbles its end on a phone. The reply context
  // stays up until the notice queued on it has been heard (capped, should the clock
  // stall), then the page leaves. Heard means out of the speaker: that is later than
  // the context's clock by the device's output delay, which is large on a phone, and a
  // context closed at the clock's end cuts the notice's last part. The reply itself may
  // be over on the clock by then, so the wait goes by the time the audio was queued to. The wait is a timer the page holds in `endDrain`: stop()
  // clears it, so a stop during the wait (a history move to another session) ends the
  // wait with it instead of leaving the new session once the notice would have played.
  const END_DRAIN_CAP_MS = 5000;
  const END_DRAIN_MARGIN_MS = 250;  // past the reported output delay, which devices under-report
  function endSession() {
    if (ending) return;
    ending = true;
    if (ws) ws.onopen = ws.onmessage = ws.onclose = null;
    micSilence();
    busy = false;
    turnAbort();
    show("Session ended", "none", "");
    const since = performance.now();
    const until = audioUntil + END_DRAIN_MARGIN_MS;
    const drained = () => !playCtx || performance.now() >= until
      || performance.now() - since > END_DRAIN_CAP_MS;
    const tick = () => { endDrain = 0; if (drained()) leave(); else endDrain = setTimeout(tick, 50); };
    tick();
  }

  // Another page (this profile's voice on another device or tab) took the voice. The server
  // closed this page's socket, or will next; the mic and the wake lock go. The page does not
  // take the voice back; its one button leads to the sessions.
  function handOver() {
    stop();
    moved = true;
    show("Voice moved to another device", "alert", "The voice is on another device now. Tap Sessions to pick one here.");
    toggle.textContent = "Sessions";
  }

  cuesShow();
  cuesEl.addEventListener("click", () => {
    cuesOn = !cuesOn;
    try { localStorage.setItem(CUES_KEY, cuesOn ? "1" : "0"); } catch (e) { /* the choice lasts for this page */ }
    cuesShow();
    cueSync();
  });
  toggle.addEventListener("click", () => {
    if (ending) return;
    if (moved) { leave(); return; }
    if (!running) { start(); return; }
    muted = !muted;
    if (muted) micAnchor = null; // after unmuting, the next sent frame anchors the count again
    toggle.setAttribute("aria-pressed", String(muted));
    toggle.textContent = muted ? "Unmute microphone" : "Mute microphone";
    status();
  });

  // --- the chooser: the newest session to go on with, New session, then the rest ------
  // Shown on load when the page URL names no session. A row shows the session's title,
  // else its preview, else when it was last active; never its id, which stays in the
  // row's click handler. A row whose session has voice on a UI client (the Desktop or the
  // Webapp) says so. The tap on a row or on New is the gesture that starts the audio.
  function ago(epoch) {
    if (!epoch) return "";
    const s = Math.max(0, Date.now() / 1000 - epoch);
    if (s < 60) return "just now";
    const m = Math.floor(s / 60);
    if (m < 60) return m + " min ago";
    const h = Math.floor(m / 60);
    if (h < 24) return h + " h ago";
    const d = Math.floor(h / 24);
    return d === 1 ? "1 day ago" : d + " days ago";
  }
  function when(epoch) {
    if (!epoch) return "Unknown time";
    return new Date(epoch * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  // A session's source is the channel that started it. This page's own sessions need no
  // tag, under the plugin's name today or the one it had before; others show a readable name.
  const OWN_SOURCES = new Set(["voice_unleashed", "voicemanager_live"]);
  const SOURCE_NAMES = { telegram: "Telegram", discord: "Discord", slack: "Slack", whatsapp: "WhatsApp",
    signal: "Signal", matrix: "Matrix", email: "Email", sms: "SMS", cli: "CLI", api_server: "API",
    webhook: "Webhook", cron: "Cron", tui: "TUI", acp: "ACP", webui: "Web UI" };
  function sourceName(source) {
    if (!source || OWN_SOURCES.has(source)) return "";
    if (SOURCE_NAMES[source]) return SOURCE_NAMES[source];
    const words = source.replace(/_/g, " ");
    return words.charAt(0).toUpperCase() + words.slice(1);
  }
  // The newest session is a card (`card` true): Continue, its name, age and length, its
  // source. The others are lines: name, source, age.
  function sessionRow(row, card) {
    const li = document.createElement("li");
    li.className = "session";
    const button = document.createElement("button");
    button.type = "button";
    button.className = card ? "row card" : "row line";
    if (card) button.append(part("label", "Continue"));
    button.append(part("name", row.title || row.preview || when(row.last_active)));
    if (card) {
      const n = row.message_count || 0;
      button.append(part("meta", [ago(row.last_active), n === 1 ? "1 line" : n + " lines"].filter(Boolean).join(" \u00b7 ")));
    }
    // On a line the source, the mark and the age wrap as one group under a long title.
    const info = card ? button : button.appendChild(part("info", ""));
    const source = sourceName(row.source);
    if (source) info.append(part("tag", source));
    if (row.voice_attached) info.append(part("voice", "Voice on Desktop"));
    if (!card) info.append(part("when", ago(row.last_active)));
    button.addEventListener("click", () => choose(row.id));
    li.appendChild(button);
    return li;
  }
  async function showChooser(detail) {
    sessionsEl.textContent = latestEl.textContent = "";
    earlierEl.hidden = true;
    chooserEl.hidden = false;
    logEl.hidden = meter.hidden = footerEl.hidden = true;
    show("Sessions", "none", detail || "");
    let rows;
    try {
      const res = await fetch(`/sessions?token=${encodeURIComponent(token)}`);
      if (!res.ok) throw new Error(String(res.status));
      rows = await res.json();
    } catch (e) {
      detailEl.textContent = "The session list did not load. You can still start a new one.";
      return;
    }
    rows.forEach((row, i) => (i ? sessionsEl : latestEl).appendChild(sessionRow(row, i === 0)));
    earlierEl.hidden = rows.length < 2;
    if (!rows.length) detailEl.textContent = "No sessions yet. Start a new one.";
  }
  // Go on with the session `id` ("new" for a fresh one): the connect asks for it and the
  // mic opens. From the chooser this runs on the tap; on a load or a history move it
  // runs by itself, and a browser that keeps playback locked gets the unmute button.
  function join(id) {
    sessionChoice = id;
    chooserEl.hidden = true;
    logEl.hidden = meter.hidden = footerEl.hidden = false;
    logAtEnd = true;
    start();
  }
  // --- the URL: session=<id> while on a session, bare on the chooser -----------------
  function urlWithSession(id) {
    const url = new URL(location.href);
    if (id) url.searchParams.set("session", id); else url.searchParams.delete("session");
    return url.pathname + url.search + url.hash;
  }
  // The URL names `id` (or no session for null), in place: the entry Back leads to stays.
  function setUrlSession(id) {
    if ((new URLSearchParams(location.search).get("session") || null) === id) return;
    window.history.replaceState({ session: id }, "", urlWithSession(id));
  }
  // A tap in the chooser: the session gets its own history entry, so Back returns to the
  // chooser. New gets one at the bare URL; the history frame fills in the id.
  function choose(id) {
    window.history.pushState({ session: id }, "", urlWithSession(id === "new" ? null : id));
    join(id);
  }
  // Back or Forward moved the URL. Without a session it is the chooser: whatever the page
  // was on ends, mic off. With one, the page joins it as a load would.
  window.addEventListener("popstate", () => {
    const id = new URLSearchParams(location.search).get("session");
    if (!id) {
      if (running || moved || ending || chooserEl.hidden) leave();
      return;
    }
    if (running || moved || ending) stop();
    join(id);
  });
  newEl.addEventListener("click", () => choose("new"));
  if (token) { if (sessionChoice) join(sessionChoice); else showChooser(); }

  // --- the meter: your level and Hermes in their title colors --------------------------
  const bars = 48, levels = new Array(bars).fill(0), whoHistory = new Array(bars).fill(0);
  const tokens = getComputedStyle(document.documentElement);
  const youColor = tokens.getPropertyValue("--you").trim(), hermesColor = tokens.getPropertyValue("--hermes").trim();
  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = meter.clientWidth, h = meter.clientHeight;
    if (meter.width !== w * dpr) { meter.width = w * dpr; meter.height = h * dpr; }
    const g = meter.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const hermesPlaying = reply && reply.audible;
    const v = hermesPlaying ? 0.35 + 0.5 * Math.abs(Math.sin(performance.now() / 140)) * speakingLevel : level;
    levels.shift(); levels.push(muted ? 0 : v);
    whoHistory.shift(); whoHistory.push(hermesPlaying ? 1 : 0);
    level *= 0.85;
    const gap = 3, bw = (w - gap * (bars - 1)) / bars;
    for (let i = 0; i < bars; i++) {
      const bh = Math.max(3, levels[i] * h);
      g.fillStyle = whoHistory[i] ? hermesColor : youColor;
      g.globalAlpha = 0.35 + 0.65 * (i / bars);
      g.fillRect(i * (bw + gap), (h - bh) / 2, bw, bh);
    }
    g.globalAlpha = 1;
    if (running) requestAnimationFrame(reduceMotion ? () => setTimeout(draw, 250) : draw);
  }
})();
</script>
</body>
</html>
