name: voice-unleashed
label: Voice Unleashed
kind: platform
version: 0.2.1
requires_hermes: ">=0.22.7"
description: >
  A voice interface to Hermes. A phone opens the page this plugin serves and
  talks to any Hermes model hands-free: the page shows the conversation, the
  tool calls and the reasoning while Hermes answers out loud, approvals and
  questions are spoken, you pick up any session of the profile, and you can
  talk over a reply to stop it. Hermes Desktop and Webapp chats get the same
  voice. Speech recognition, speech synthesis and turn-taking run on your own
  VoiceManager server.
author: TacoTakumi
provides_hooks:
  - on_stream_delta
  - on_stream_end
  - on_session_end
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
requires_env:
  - name: VOICE_UNLEASHED_TOKEN
    description: "Access token for the voice page and its WebSocket (put it in the page URL as ?token=...)"
    prompt: "Voice page access token"
    password: true
  - name: VOICE_UNLEASHED_VOICEMANAGER_URL
    description: "VoiceManager server URL (e.g. http://127.0.0.1:8255)"
    prompt: "VoiceManager URL"
    password: false
  - name: VOICE_UNLEASHED_ALLOWED_USERS
    description: "Gateway allowlist for this platform; set it to owner"
    prompt: "Allowed users (owner)"
    password: false
optional_env:
  - name: VOICE_UNLEASHED_VOICEMANAGER_TOKEN
    description: "Bearer token for VoiceManager, when the server requires one"
    prompt: "VoiceManager token (optional)"
    password: true
  - name: VOICE_UNLEASHED_HOST
    description: "Address the voice page listens on (default 127.0.0.1)"
    prompt: "Listen address"
    password: false
  - name: VOICE_UNLEASHED_PORT
    description: "Port the voice page listens on (default 8765)"
    prompt: "Listen port"
    password: false
